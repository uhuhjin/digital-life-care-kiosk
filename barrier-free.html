<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메가MGC커피 베리어프리 메뉴</title>
  <link rel="stylesheet" href="barrier-free.css">
</head>
<body>
  <div class="app-shell">
    <main class="barrier-free-screen" aria-label="베리어프리 메뉴 화면">
      <div class="barrier-free-head">
        <img src="메가커피_이미지/logo/logo.png" alt="메가MGC커피" class="barrier-free-logo">
        <a class="barrier-free-back-button" href="index.html">처음으로</a>
      </div>

      <div class="barrier-free-grid" aria-label="큰 글씨 메뉴 분류">
        <button class="barrier-free-category is-coffee" type="button">커피</button>
        <button class="barrier-free-category is-drink" type="button">일반 음료</button>
        <button class="barrier-free-category is-food" type="button">푸드</button>
        <button class="barrier-free-category is-goods" type="button">상품</button>
      </div>
    </main>
  </div>
</body>
</html>
